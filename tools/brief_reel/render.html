<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IB;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
@font-face{font-family:IXB;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf)}
@font-face{font-family:IM;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf)}
@font-face{font-family:IMI;src:url(file:///usr/share/fonts/opentype/inter/Inter-MediumItalic.otf)}
@font-face{font-family:ISB;src:url(file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf)}
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<img id="star" src="assets/star.png" style="display:none">
<img id="logo" src="assets/logo.png" style="display:none">
<img id="lotus" src="assets/lotus.png" style="display:none">
<img id="conch" src="assets/conch.png" style="display:none">
<script>
const W=1080,H=1920,cv=document.getElementById('c'),x=cv.getContext('2d');
const INK='#2B2118',SAF='#F19611',MAR='#FCC25F',LIGHT='#F3DDB8',PAPER='#F7EFE1',MUTE='#B9A88E',RED='#C2502E';
const IMG=id=>document.getElementById(id);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-cl(t),3), eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
let CFG=null; // {segs:[{start,end,text,scene}], total, endcard}
// seeded rng
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// paper noise
const noise=document.createElement('canvas');noise.width=W;noise.height=H;
(()=>{const n=noise.getContext('2d'),d=n.createImageData(W,H),r=rng(7);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=10}n.putImageData(d,0,0)})();
// maze
const MZ=(()=>{const N=9,r=rng(42),walls=[];const vis=Array(N*N).fill(0);const E=new Set();
 function nb(c){const i=c%N,j=(c/N)|0,o=[];if(i>0)o.push(c-1);if(i<N-1)o.push(c+1);if(j>0)o.push(c-N);if(j<N-1)o.push(c+N);return o}
 const st=[0];vis[0]=1;while(st.length){const c=st[st.length-1];const o=nb(c).filter(n=>!vis[n]);if(!o.length){st.pop();continue}const n=o[(r()*o.length)|0];E.add(Math.min(c,n)+'-'+Math.max(c,n));vis[n]=1;st.push(n)}
 // path solve 0 -> N*N-1 via BFS
 const prev={0:-1},q=[0];while(q.length){const c=q.shift();for(const n of nb(c)){const k=Math.min(c,n)+'-'+Math.max(c,n);if(E.has(k)&&!(n in prev)){prev[n]=c;q.push(n)}}}
 const path=[];let c=N*N-1;while(c!=-1){path.unshift(c);c=prev[c]}
 return {N,E,path}})();

function txt(s,X,Y,font,col,al='center',a=1){x.save();x.globalAlpha*=a;x.font=font;x.fillStyle=col;x.textAlign=al;x.textBaseline='middle';x.fillText(s,X,Y);x.restore()}
function bg(t){
 x.fillStyle=PAPER;x.fillRect(0,0,W,H);
 const g=x.createRadialGradient(W/2,H*0.45,200,W/2,H*0.5,1300);g.addColorStop(0,'rgba(255,250,240,0)');g.addColorStop(1,'rgba(120,90,50,0.22)');x.fillStyle=g;x.fillRect(0,0,W,H);
 // faint grid
 x.save();x.strokeStyle='rgba(43,33,24,0.035)';x.lineWidth=1;for(let i=0;i<=W;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<=H;j+=60){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}x.restore();
 // star watermark
 x.save();x.globalAlpha=0.07;x.translate(W/2,1180);x.rotate(t*0.03);x.drawImage(IMG('star'),-560,-560,1120,1120);x.restore();
 // conch & lotus corners
 x.save();x.globalAlpha=0.16;x.drawImage(IMG('conch'),W-170,H-300,150,228);x.translate(30,H-190);x.drawImage(IMG('lotus'),0,0,220,118);x.restore();
 x.drawImage(noise,0,0);
}
function header(t){
 x.save();txt('OMNIX',70,140,'26px IXB',SAF,'left');txt('·  THE BRIEF',178,140,'22px ISB',INK,'left',0.55);
 txt(CFG.dateLabel||'',W-70,140,'22px ISB',INK,'right',0.55);x.fillStyle='rgba(43,33,24,0.15)';x.fillRect(70,172,W-140,2);x.restore();
}
// ---------- captions ----------
const KEY=['bunker','mode','A.I.','A.I','quantum','months,','months','years.','not','shortcut','no','such','attack','off-chain','rush.','don\'t','exist','yet.','hit.','real.','maths'];
let CHUNKS=null;
function buildChunks(){CHUNKS=[];CFG.segs.forEach((s,si)=>{const keys=s.keys||[];const words=[];
 (s.parts||[[s.text,s.start,s.end]]).forEach(([txt0,a,b])=>{const ws=txt0.split(/\s+/);const tot=ws.reduce((q,w)=>q+w.length+3,0);let acc=0;ws.forEach(w=>{words.push({w,st:a+(b-a)*acc/tot,key:keys.includes(w)});acc+=w.length+3})});
 let cur=[];const flush=()=>{if(cur.length)CHUNKS.push({si,words:cur});cur=[]};
 words.forEach(o=>{cur.push(o);const len=cur.map(c=>c.w).join(' ').length;if(len>=20||/[.?:]$/.test(o.w)||/\.\.\.$/.test(o.w)||(/,$/.test(o.w)&&len>10))flush()});flush()});
 CHUNKS.forEach(c=>c.st=c.words[0].st);
 CHUNKS.forEach((c,i)=>{const nx=CHUNKS[i+1];const seg=CFG.segs[c.si];c.en=nx?(nx.si!=c.si?Math.min(nx.st,seg.end+0.35):nx.st):seg.end+0.4})}
function captions(t){
 const c=CHUNKS.find(c=>t>=c.st-0.05&&t<c.en);if(!c)return;
 const fa=cl((t-c.st+0.05)/0.12)*cl((c.en-t)/0.1);
 // layout: wrap into lines width 900
 x.save();x.textBaseline='alphabetic';const F=84;const items=c.words.map(o=>{const f=o.key?`${F}px IXB`:`${F}px IB`;x.font=f;return{...o,f,wd:x.measureText(o.w+' ').width}});
 const lines=[[]];let lw=0;items.forEach(it=>{if(lw+it.wd>920&&lines[lines.length-1].length){lines.push([]);lw=0}lines[lines.length-1].push(it);lw+=it.wd});
 const y0=330-(lines.length-1)*50;
 lines.forEach((ln,li)=>{const tw=ln.reduce((a,b)=>a+b.wd,0);let X=W/2-tw/2;ln.forEach(it=>{const on=t>=it.st;const k=cl((t-it.st)/0.14);x.save();x.globalAlpha=fa*(on?1:0.22);x.font=it.f;x.fillStyle=it.key?SAF:INK;if(!on)x.fillStyle=MUTE;const yy=y0+li*100+(on?(1-eo(k))*14:0);x.fillText(it.w,X,yy);x.restore();X+=it.wd})});
 x.restore();
}
// ---------- scene helpers ----------
function circle(cx,cy,r,stroke,lw,fill){x.beginPath();x.arc(cx,cy,r,0,7);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
const CY=1130;
const S={};
// Episode scenes are injected from EPISODE_DIR/scenes.js (S.<name>=(p,lt,d,t)=>{...})
function endcard(lt){const a=eo(lt/0.6);x.save();x.globalAlpha=a;x.fillStyle=PAPER;x.fillRect(0,0,W,H);x.drawImage(noise,0,0);
 x.save();x.globalAlpha=0.09;x.translate(W/2,H/2);x.rotate(lt*0.05);x.drawImage(IMG('star'),-600,-600,1200,1200);x.restore();
 const s=back(lt/0.7);x.save();x.translate(W/2,760);x.scale(s,s);x.drawImage(IMG('logo'),-150,-150,300,300);x.restore();
 txt('OMNIX',W/2,990,'120px IXB',SAF,'center',eo((lt-0.2)/0.5));txt('Beyond Imagination',W/2,1080,'46px IM',SAF,'center',eo((lt-0.3)/0.5));
 x.fillStyle='rgba(241,150,17,.5)';x.fillRect(W/2-260*eo((lt-0.4)/0.5),1140,520*eo((lt-0.4)/0.5),3);
 txt('Built in Bengaluru  ·  DMs open',W/2,1210,'42px ISB',INK,'center',eo((lt-0.6)/0.5));
 txt(CFG.sourceFull||'',W/2,1560,'30px IM',INK,'center',0.5*eo((lt-0.8)/0.5));
 x.globalAlpha=0.18*a;x.drawImage(IMG('conch'),W-200,H-330,170,258);x.drawImage(IMG('lotus'),40,H-210,260,140);x.restore()}

function render(t){
 if(!CHUNKS)buildChunks();
 bg(t);header(t);
 const segs=CFG.segs;let si=segs.findIndex((s,i)=>t<(segs[i+1]?segs[i+1].start:s.end+0.6));
 if(t>=CFG.endStart){endcard(t-CFG.endStart);return cv.toDataURL('image/jpeg',0.9)}
 if(si<0)si=segs.length-1;const s=segs[si];const s0=si?s.start-0.15:0;const s1=segs[si+1]?segs[si+1].start-0.15:CFG.endStart;
 const lt=t-s0,d=s1-s0,p=cl(lt/d);const fade=cl((s1-t)/0.25);
 x.save();x.globalAlpha=fade;S[s.scene](p,lt,d,t);x.restore();
 captions(t);
 txt(CFG.sourceShort||'',W/2,1800,'26px IM',INK,'center',0.35);
 return cv.toDataURL('image/jpeg',0.9);
}
window.render=render;window.setCfg=c=>{CFG=c;CHUNKS=null};
</script></body></html>
